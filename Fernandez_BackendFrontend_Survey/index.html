<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

	</head>

	<body>
	<h2> COFFEE SHOP</h2>

		What is your Name?
		<input id='name' type='text'>

		What is your Password?
		<input id='password' type='text'>

	
		<button type="button" 
		onclick="clickButton( document.getElementById('name').value ,document.getElementById('password').value)">Login</button>

		
        <button type = 'button' onclick= "window.location.href = 'register.html'">  Sign up </button>

		<script>



		const clickButton = (a,b) =>{

			const postData = {
				name:a,
				password :b,
			
			}
			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/survey',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
